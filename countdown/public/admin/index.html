<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>抽籤後台</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f6fb;
            --card: #ffffff;
            --text: #1d2140;
            --muted: #6b7090;
            --line: #e4e6f2;
            --accent: #6a78d8;
            --accent-text: #ffffff;
            --danger: #c9415a;
            --ok: #2f8a5b;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #12131c;
                --card: #1b1d2a;
                --text: #e9eaf5;
                --muted: #9a9dbb;
                --line: #2b2e40;
                --accent: #8f9bf0;
                --accent-text: #12131c;
                --danger: #f07a8f;
                --ok: #6fd3a0;
                color-scheme: dark;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            padding: 32px 16px 64px;
        }

        .wrap {
            max-width: 880px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            justify-content: space-between;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .status {
            margin-top: 4px;
            color: var(--muted);
        }

        .status b {
            color: var(--text);
            font-weight: 500;
        }

        .pill {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid currentColor;
        }

        .pill.open {
            color: var(--accent);
        }

        .pill.done {
            color: var(--ok);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            padding: 9px 16px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-text);
        }

        button.danger {
            color: var(--danger);
        }

        button:disabled {
            opacity: .45;
            cursor: default;
        }

        .card {
            margin-top: 24px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        th {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .06em;
            color: var(--muted);
        }

        td.num {
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            width: 1%;
        }

        td.topic,
        td.result {
            word-break: break-word;
        }

        td.result small {
            display: block;
            color: var(--muted);
        }

        td.x {
            width: 1%;
            text-align: right;
        }

        td.x button {
            padding: 4px 10px;
            font-size: 13px;
        }

        .empty {
            padding: 40px 16px;
            text-align: center;
            color: var(--muted);
        }

        .msg {
            margin-top: 16px;
            min-height: 1.5em;
            color: var(--danger);
        }

        @media (max-width: 600px) {

            th:nth-child(1),
            td.num {
                display: none;
            }

            th,
            td {
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div>
                <h1>抽籤後台</h1>
                <p class="status" id="status">載入中…</p>
            </div>
            <div class="actions">
                <button class="primary" id="draw">抽籤</button>
                <button id="reset" hidden>撤銷抽籤</button>
                <button class="danger" id="clear">清空全部</button>
            </div>
        </header>

        <p class="msg" id="msg" role="alert"></p>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>名字</th>
                        <th>登記的主題</th>
                        <th>抽到</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <p class="empty" id="empty" hidden>還沒有人登記</p>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const fmt = new Intl.DateTimeFormat("zh-TW", {
            timeZone: "Asia/Taipei", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false,
        });
        let state = null;

        async function api(path, body) {
            const res = await fetch("/admin/api/" + path, body === undefined
                ? {cache: "no-store"}
                : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        }

        async function load() {
            try {
                state = await api("state");
                $("msg").textContent = "";
                render();
            } catch (e) {
                $("msg").textContent = "讀取失敗：" + e.message;
            }
        }

        function cell(tr, text, cls) {
            const td = document.createElement("td");
            if (cls) td.className = cls;
            if (text !== undefined) td.textContent = text;
            tr.append(td);
            return td;
        }

        function render() {
            const {participants: list, drawnAt} = state;
            const drawn = drawnAt !== null;

            $("status").innerHTML = "";
            const pill = document.createElement("span");
            pill.className = "pill " + (drawn ? "done" : "open");
            pill.textContent = drawn ? "已抽籤" : "登記中";
            const n = document.createElement("b");
            n.textContent = list.length;
            $("status").append(pill, "　共 ", n, " 人", drawn ? `　·　抽籤時間 ${fmt.format(drawnAt)}` : "");

            $("draw").textContent = drawn ? "重新抽籤" : "抽籤";
            $("draw").disabled = list.length < 2;
            $("draw").title = list.length < 2 ? "至少要 2 個人" : "";
            $("reset").hidden = !drawn;
            $("reset").disabled = false;
            $("clear").disabled = list.length === 0;

            const rows = $("rows");
            rows.replaceChildren();
            list.forEach((p, i) => {
                const tr = document.createElement("tr");
                cell(tr, i + 1, "num");
                cell(tr, p.name);
                cell(tr, p.topic, "topic");
                const r = cell(tr, undefined, "result");
                if (p.result) {
                    r.textContent = p.result;
                    const s = document.createElement("small");
                    s.textContent = "來自 " + p.resultFrom;
                    r.append(s);
                } else {
                    r.textContent = "—";
                }
                const x = cell(tr, undefined, "x");
                if (!drawn) {
                    const b = document.createElement("button");
                    b.className = "danger";
                    b.textContent = "刪除";
                    b.onclick = () => act("delete", {id: p.id}, `刪除「${p.name}」的登記？`);
                    x.append(b);
                }
                rows.append(tr);
            });
            $("empty").hidden = list.length > 0;
        }

        async function act(path, body, question) {
            if (question && !confirm(question)) return;
            document.querySelectorAll("button").forEach((b) => (b.disabled = true));
            try {
                await api(path, body);
                $("msg").textContent = "";
            } catch (e) {
                $("msg").textContent = e.message;
            }
            await load();
        }

        $("draw").onclick = () => act("draw", {},
            state.drawnAt !== null ? "重新抽籤會覆蓋目前的結果，大家看到的會跟著改變。確定？" : `為 ${state.participants.length} 人抽籤？抽完後登記會關閉。`);
        $("reset").onclick = () => act("reset", {}, "撤銷抽籤結果並重新開放登記？");
        $("clear").onclick = () => act("clear", {}, "刪除所有登記與抽籤結果？無法復原。");

        load();
        setInterval(() => !document.hidden && load(), 10000);
    </script>
</body>

</html>
